<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HERMES tuner</title>
<!--
  Tune the station's receiver and listen, on the station API (hermes.v1):
  step or type a frequency, or seek the next or previous station: the page
  steps through the band (radio.set) and stops where the S-meter
  (radio.state) rises above the noise it has seen. Listen plays the
  receiver over WebRTC (rtc.offer, receive only); the noise reduction
  switch is the profile's noise_reduction. Self-contained, like
  spectrum.html.
-->
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --line: #1f2a37; --fg: #d7e0ea; --dim: #7d8b9a;
    --accent: #3ad1a0; --tx: #ff5d5d; --warn: #ffb84d;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .tag { font: 600 12px/1 var(--mono); padding: 4px 7px; border-radius: 4px;
    background: var(--line); color: var(--fg); letter-spacing: .06em; }
  .tag.tx { background: var(--tx); color: #fff; }
  .stat { font: 13px var(--mono); color: var(--dim); }
  .grow { flex: 1; }
  #conn { font-size: 12px; }
  #conn.ok { color: var(--accent); } #conn.bad { color: var(--tx); }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px; display: grid; gap: 22px; }
  .dial { font: 600 clamp(40px, 11vw, 72px)/1 var(--mono); letter-spacing: .02em; text-align: center; }
  .dial small { font-size: .3em; color: var(--dim); }
  #band { text-align: center; color: var(--dim); font: 13px var(--mono); min-height: 1.4em; }
  .meter { height: 14px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter div { height: 100%; width: 0; background: linear-gradient(90deg, #1a7d3a, #3fd06a 50%, #e8d23a 75%, #e85a2a);
    transition: width .15s linear; }
  .scale { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  button, select, input { font: inherit; color: var(--fg); background: #0d131b;
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.big { font-size: 18px; padding: 12px 22px; min-width: 9em; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #seekstate { text-align: center; font: 13px var(--mono); color: var(--warn); min-height: 1.4em; }
  label { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  #freqin { width: 9em; font-family: var(--mono); }
  #found { font: 12px var(--mono); color: var(--dim); }
  #found li { cursor: pointer; } #found li:hover { color: var(--fg); }
  #decodes { font: 13px var(--mono); max-height: 22em; overflow: auto; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; background: #070a0e; }
  #decodes div { white-space: pre-wrap; word-break: break-word; }
  #decodes .tx { color: var(--warn); }
  #decodes .meta { color: var(--dim); }
  #login { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 8, 12, .88); }
  #login form { display: grid; gap: 10px; width: min(320px, 90vw); padding: 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #login h1 { margin: 0 0 6px; font-size: 18px; }
  #login .err { color: var(--tx); font-size: 13px; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <b>HERMES tuner</b>
  <span class="tag" id="mode">–</span>
  <span class="tag" id="txrx">RX</span>
  <span class="grow"></span>
  <button id="listen" type="button" hidden>Listen</button>
  <span class="stat" id="audio"></span>
  <span id="conn" class="bad">offline</span>
  <button id="logout" type="button" hidden>Log out</button>
</header>

<main>
  <div>
    <div class="dial" id="dial">–<small> kHz</small></div>
    <div id="band"></div>
  </div>

  <div>
    <div class="meter"><div id="smeter"></div></div>
    <div class="scale"><span>S1</span><span>S3</span><span>S5</span><span>S7</span><span>S9</span><span>+20</span><span>+40</span><span id="sread">–</span></div>
  </div>

  <div class="row">
    <button class="big" id="prev" type="button" title="Seek down (Page Down)">◀◀ Prev station</button>
    <button class="big" id="next" type="button" title="Seek up (Page Up)">Next station ▶▶</button>
  </div>
  <div id="seekstate"></div>

  <div class="row">
    <button id="down" type="button" title="One step down (←)">− step</button>
    <button id="up" type="button" title="One step up (→)">+ step</button>
    <label>Step <select id="step">
      <option value="1000">1 kHz</option><option value="5000" selected>5 kHz</option>
      <option value="9000">9 kHz</option><option value="10000">10 kHz</option></select></label>
    <label>Mode <select id="modesel">
      <option>AM</option><option>USB</option><option>LSB</option><option>CW</option><option>FM</option>
      <option>RTTY</option><option>FT8</option></select></label>
    <label>Profile <select id="profile"></select></label>
    <label title="On the received audio you listen to">Noise reduction <input id="nr" type="checkbox"></label>
  </div>

  <div class="row">
    <label>Seek in <select id="range">
      <option value="bc" selected>broadcast bands</option>
      <option value="ham">amateur bands</option>
      <option value="all">everything, 0.5–30 MHz</option></select></label>
    <label>Above the noise by <select id="thresh">
      <option value="2">2 dB</option><option value="3" selected>3 dB</option>
      <option value="6">6 dB</option><option value="10">10 dB</option></select></label>
    <label>Dwell <select id="dwell">
      <option value="250">250 ms</option><option value="400" selected>400 ms</option>
      <option value="700">700 ms</option></select></label>
  </div>

  <form class="row" id="freqform">
    <input id="freqin" inputmode="decimal" placeholder="kHz" autocomplete="off">
    <button type="submit">Tune</button>
  </form>

  <div>
    <div class="stat">Decoded (CW, RTTY and FT8 in those modes; newest first):</div>
    <div id="decodes"></div>
  </div>

  <div>
    <div class="stat">Stations found this session (click to go back):</div>
    <ul id="found"></ul>
  </div>
</main>

<div id="login" hidden>
  <form id="loginform">
    <h1>Log in to the station</h1>
    <input id="station" placeholder="station (host:port)" autocomplete="off">
    <input id="user" placeholder="username" autocomplete="username" required>
    <input id="pass" type="password" placeholder="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div class="err" id="loginerr"></div>
  </form>
</div>

<audio id="rx"></audio>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };

// ── session, as spectrum.html and map.html ───────────────────────────────
function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

var station = load('hermes.station') || location.host || '';
var token = load('hermes.token');
var secure = location.protocol === 'https:';
function apiBase() { return (secure ? 'https://' : 'http://') + station + '/api/v2'; }
function wsURL() { return (secure ? 'wss://' : 'ws://') + station + '/api/v2/ws'; }

function showLogin(why) {
  $('station').value = station;
  $('loginerr').textContent = why || '';
  $('login').hidden = false;
  $('logout').hidden = true;
  $('user').focus();
}
$('loginform').addEventListener('submit', function (ev) {
  ev.preventDefault();
  station = $('station').value.trim() || location.host;
  fetch(apiBase() + '/session', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: $('user').value, password: $('pass').value})
  }).then(function (r) {
    return r.json().then(function (j) { return {status: r.status, body: j}; });
  }).then(function (r) {
    if (r.status !== 201 || !r.body.token) { $('loginerr').textContent = r.body.detail || ('login failed (' + r.status + ')'); return; }
    token = r.body.token;
    store('hermes.token', token); store('hermes.station', station);
    $('pass').value = ''; $('loginerr').textContent = ''; $('login').hidden = true;
    connect();
  }).catch(function () { $('loginerr').textContent = 'cannot reach ' + station; });
});
$('logout').addEventListener('click', function () {
  fetch(apiBase() + '/session', {method: 'DELETE', headers: token ? {Authorization: 'Bearer ' + token} : {}}).catch(function () {});
  token = null; store('hermes.token', null);
  if (ws) ws.close();
  showLogin();
});

// ── hermes.v1 ────────────────────────────────────────────────────────────
var ws = null, helloSeen = false, nextId = 1, pending = {}, state = {};
function cmd(name, args) {
  if (!ws || ws.readyState !== 1) return Promise.reject({code: 'closed', message: 'not connected'});
  var id = String(nextId++);
  ws.send(JSON.stringify({type: 'cmd', id: id, cmd: name, args: args || {}}));
  return new Promise(function (ok, fail) { pending[id] = {ok: ok, fail: fail}; });
}
function connect() {
  helloSeen = false;
  setConn('connecting', false);
  var protocols = token ? ['hermes.v1', 'hermes.token.' + token] : ['hermes.v1'];
  try { ws = new WebSocket(wsURL(), protocols); }
  catch (e) { setConn('bad URL', false); showLogin('cannot open ' + wsURL()); return; }
  ws.onmessage = function (ev) {
    if (typeof ev.data !== 'string') return;
    var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'hello') {
      helloSeen = everLive = true;
      $('logout').hidden = !token;
      $('listen').hidden = (m.commands || []).indexOf('rtc.offer') < 0;
      setConn('live · ' + m.role, true);
      ws.send(JSON.stringify({type: 'subscribe', id: 'sub', topics: ['radio.state', 'digi']}));
      loadProfiles();
    } else if (m.type === 'event' && m.topic === 'radio.state') {
      if (m.snapshot) state = {};
      for (var k in m.data) state[k] = m.data[k];
      showState();
    } else if (m.type === 'event' && m.topic === 'digi') {
      addDecode(m.data);
    } else if (m.type === 'reply') {
      var p = pending[m.id];
      if (p) { delete pending[m.id]; if (m.ok) p.ok(m.data); else p.fail(m.error); }
    }
  };
  ws.onclose = function (ev) {
    setConn('offline', false);
    stopSeek('');
    stopListening();
    for (var id in pending) pending[id].fail({code: 'closed', message: 'the connection closed'});
    pending = {};
    if (ev.code === 1008) {                   // the session ended
      token = null; store('hermes.token', null);
      showLogin('the session ended: log in again');
      return;
    }
    if (!helloSeen && !everLive) {            // refused from the start: a login is needed
      token = null; store('hermes.token', null);
      showLogin('log in to the station');
      return;
    }
    reconnect(helloSeen);
  };
}

// Once live, a reconnect that fails is the station restarting or the
// network: try again. Only a station that answers and still refuses the
// socket, three times, wants a login.
var everLive = false, refused = 0;
function reconnect(wasLive) {
  if (wasLive) { refused = 0; setTimeout(connect, 2000); return; }
  fetch(apiBase() + '/health').then(function (r) {
    if (r.ok && ++refused >= 3) {
      refused = 0;
      token = null; store('hermes.token', null);
      showLogin('the station refused the connection: log in again');
    } else {
      setTimeout(connect, 2000);
    }
  }, function () { setTimeout(connect, 2000); });
}
function setConn(text, ok) { var c = $('conn'); c.textContent = text; c.className = ok ? 'ok' : 'bad'; }

// s_meter_db is dB relative to S9 (S9 = 0, 6 dB an S-unit).
function sText(db) {
  if (db == null || db <= -199) return '–';
  return db > 0 ? 'S9+' + Math.round(db) : 'S' + Math.max(0, Math.round(9 + db / 6));
}
function showState() {
  if (state.frequency_hz) {
    $('dial').innerHTML = (state.frequency_hz / 1000).toFixed(state.frequency_hz % 1000 ? 2 : 0) + '<small> kHz</small>';
    var b = bandOf(state.frequency_hz, BANDS.bc) || bandOf(state.frequency_hz, BANDS.ham);
    $('band').textContent = b ? b.name : '';
  }
  if (state.active_profile != null && document.activeElement !== $('profile'))
    $('profile').value = String(state.active_profile);
  if (state.mode) {
    $('mode').textContent = state.mode;
    if (document.activeElement !== $('modesel')) $('modesel').value = state.mode;
  }
  $('txrx').textContent = state.tx ? 'TX' : 'RX';
  $('txrx').className = 'tag' + (state.tx ? ' tx' : '');
  if (state.noise_reduction != null) $('nr').checked = state.noise_reduction;
  $('nr').parentNode.hidden = state.noise_reduction == null;     // a radiod without it
  var db = state.s_meter_db;
  // S1 (-48 dB) .. S9+40: the bar
  $('smeter').style.width = db == null || db <= -199 ? '0' : Math.max(0, Math.min(100, (db + 54) / 94 * 100)) + '%';
  $('sread').textContent = sText(db);
}

// ── bands ────────────────────────────────────────────────────────────────
// Where seeking goes: in kHz, with the channel step each band uses.
var BANDS = {
  bc: [
    {name: 'MW', lo: 531, hi: 1602, step: 9}, {name: '120 m', lo: 2300, hi: 2495, step: 5},
    {name: '90 m', lo: 3200, hi: 3400, step: 5}, {name: '75 m', lo: 3900, hi: 4000, step: 5},
    {name: '60 m', lo: 4750, hi: 5060, step: 5}, {name: '49 m', lo: 5900, hi: 6200, step: 5},
    {name: '41 m', lo: 7200, hi: 7450, step: 5}, {name: '31 m', lo: 9400, hi: 9900, step: 5},
    {name: '25 m', lo: 11600, hi: 12100, step: 5}, {name: '22 m', lo: 13570, hi: 13870, step: 5},
    {name: '19 m', lo: 15100, hi: 15800, step: 5}, {name: '16 m', lo: 17480, hi: 17900, step: 5},
    {name: '15 m', lo: 18900, hi: 19020, step: 5}, {name: '13 m', lo: 21450, hi: 21850, step: 5},
    {name: '11 m', lo: 25670, hi: 26100, step: 5}],
  ham: [
    {name: '160 m', lo: 1810, hi: 2000}, {name: '80 m', lo: 3500, hi: 3800}, {name: '60 m', lo: 5351, hi: 5367},
    {name: '40 m', lo: 7000, hi: 7200}, {name: '30 m', lo: 10100, hi: 10150}, {name: '20 m', lo: 14000, hi: 14350},
    {name: '17 m', lo: 18068, hi: 18168}, {name: '15 m', lo: 21000, hi: 21450}, {name: '12 m', lo: 24890, hi: 24990},
    {name: '10 m', lo: 28000, hi: 29700}],
  all: [{name: '', lo: 500, hi: 30000}]
};
function bandOf(hz, list) {
  var k = hz / 1000;
  for (var i = 0; i < list.length; i++) if (k >= list[i].lo && k <= list[i].hi) return list[i];
  return null;
}

// The next frequency to try going dir (+1 or -1): one step in the band, or
// the edge of the next band; on the band's channel raster when it has one.
function nextFreq(hz, dir) {
  var list = BANDS[$('range').value], step = +$('step').value, k = hz / 1000;
  var b = bandOf(hz, list);
  if (b) {
    var s = b.step && $('range').value === 'bc' ? b.step : step / 1000;
    var n = dir > 0 ? Math.floor(k / s + 1e-6) * s + s : Math.ceil(k / s - 1e-6) * s - s;
    if (n >= b.lo && n <= b.hi) return Math.round(n * 1000);
  }
  // into the next band that way, wrapping around
  var i, cands = list.slice().sort(function (x, y) { return x.lo - y.lo; });
  if (dir > 0) {
    for (i = 0; i < cands.length; i++) if (cands[i].lo > k) return startOf(cands[i], 1);
    return startOf(cands[0], 1);
  }
  for (i = cands.length - 1; i >= 0; i--) if (cands[i].hi < k) return startOf(cands[i], -1);
  return startOf(cands[cands.length - 1], -1);
}
function startOf(b, dir) {
  var s = b.step || (+$('step').value / 1000);
  var k = dir > 0 ? Math.ceil(b.lo / s) * s : Math.floor(b.hi / s) * s;
  return Math.round(k * 1000);
}

// ── tuning and seeking ───────────────────────────────────────────────────
function tune(hz) {
  return cmd('radio.set', {frequency_hz: hz}).catch(function (e) { $('seekstate').textContent = 'tune: ' + (e.message || e.code); throw e; });
}
function sleep(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }

var seeking = 0;          // a token: a new seek or a stop makes the old one quit
function stopSeek(why) {
  seeking++;
  $('prev').className = $('next').className = 'big';
  $('seekstate').textContent = why || '';
}
function seek(dir) {
  var me = ++seeking, floor = null, tried = 0;
  var start = state.frequency_hz, hz = start;
  $(dir > 0 ? 'next' : 'prev').className = 'big on';
  $('seekstate').textContent = 'seeking ' + (dir > 0 ? 'up' : 'down') + '…  (click again or Esc to stop)';
  (function step() {
    if (me !== seeking) return;
    hz = nextFreq(hz, dir);
    if (++tried > 2000) { stopSeek('nothing found'); return; }
    tune(hz).then(function () { return sleep(+$('dwell').value); }).then(function () {
      if (me !== seeking) return;
      var db = state.s_meter_db;
      if (db == null || db <= -199) { step(); return; }
      // the noise: the lowest of the readings so far, rising slowly so
      // that a band's noise level, higher than the last one's, is learned
      floor = floor == null ? db : Math.min(db, floor + 0.3);
      if (tried > 2 && db >= floor + +$('thresh').value) {
        stopSeek('found ' + (hz / 1000) + ' kHz, ' + sText(db));
        remember(hz, db);
        return;
      }
      $('seekstate').textContent = 'seeking ' + (dir > 0 ? 'up' : 'down') + '…  ' + (hz / 1000) + ' kHz  ' + sText(db) +
        '  (noise ' + sText(floor) + ')';
      step();
    }, function () { stopSeek(''); });
  })();
}
$('next').addEventListener('click', function () { if (this.className.indexOf('on') >= 0) stopSeek('stopped'); else seek(1); });
$('prev').addEventListener('click', function () { if (this.className.indexOf('on') >= 0) stopSeek('stopped'); else seek(-1); });
$('up').addEventListener('click', function () { stopSeek(''); tune(state.frequency_hz + +$('step').value); });
$('down').addEventListener('click', function () { stopSeek(''); tune(state.frequency_hz - +$('step').value); });
$('modesel').addEventListener('change', function () {
  cmd('radio.set', {mode: this.value}).catch(function (e) { $('seekstate').textContent = 'mode: ' + (e.message || e.code); });
});
$('nr').addEventListener('change', function () {
  var on = this.checked;
  cmd('radio.set', {noise_reduction: on}).catch(function (e) {
    $('nr').checked = !on;
    $('seekstate').textContent = 'noise reduction: ' + (e.message || e.code);
  });
});
$('freqform').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var k = parseFloat($('freqin').value.replace(',', '.'));
  if (!(k > 0)) return;
  stopSeek('');
  tune(Math.round(k < 100 ? k * 1e6 : k * 1000));     // MHz or kHz
  $('freqin').value = '';
});
document.addEventListener('keydown', function (ev) {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === 'Escape') stopSeek('stopped');
  else if (ev.key === 'PageUp') seek(1);
  else if (ev.key === 'PageDown') seek(-1);
  else if (ev.key === 'ArrowRight') $('up').click();
  else if (ev.key === 'ArrowLeft') $('down').click();
  else return;
  ev.preventDefault();
});

// ── profiles, and what the digital modes decode ──────────────────────────
function loadProfiles() {
  fetch(apiBase() + '/radio/profiles', {headers: token ? {Authorization: 'Bearer ' + token} : {}})
    .then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      if (!j || !j.data) return;
      var sel = $('profile');
      sel.textContent = '';
      j.data.forEach(function (p) {
        var o = document.createElement('option');
        o.value = String(p.profile);
        o.textContent = p.profile + ': ' + p.mode + ' ' + (p.frequency_hz / 1000) + ' kHz';
        sel.appendChild(o);
      });
      if (state.active_profile != null) sel.value = String(state.active_profile);
    }).catch(function () {});
}
$('profile').addEventListener('change', function () {
  stopSeek('');
  cmd('radio.select_profile', {profile: +this.value}).then(loadProfiles,
    function (e) { $('seekstate').textContent = 'profile: ' + (e.message || e.code); });
});

// Decoded text comes off the air: untrusted, only ever set as text.
var seenDecodes = {};
function addDecode(d) {
  if (!d || seenDecodes[d.id] || d.mode === 'DSTAR') return;
  seenDecodes[d.id] = true;
  var box = $('decodes'), row = document.createElement('div'), meta = document.createElement('span');
  row.className = d.dir === 'tx' ? 'tx' : '';
  meta.className = 'meta';
  meta.textContent = (d.at || '').slice(11, 19) + ' ' + d.mode + ' ' +
    (d.frequency_hz != null ? Math.round(d.frequency_hz / 100) / 10 + ' kHz ' : '') +
    (d.offset_hz != null ? d.offset_hz + ' Hz ' : '') +
    (d.snr_db != null ? d.snr_db + ' dB ' : '') +
    (d.dir === 'tx' ? 'TX ' : '') + ' ';
  row.appendChild(meta);
  row.appendChild(document.createTextNode(d.text || ''));
  box.insertBefore(row, box.firstChild);
  while (box.children.length > 300) box.removeChild(box.lastChild);
}

var found = [];
function remember(hz, db) {
  if (found.some(function (f) { return f.hz === hz; })) return;
  found.unshift({hz: hz, db: db, at: new Date()});
  var ul = $('found');
  ul.textContent = '';
  found.slice(0, 30).forEach(function (f) {
    var li = document.createElement('li');
    li.textContent = (f.hz / 1000) + ' kHz  ' + sText(f.db) + '  ' + f.at.toISOString().slice(11, 16) + ' UTC';
    li.addEventListener('click', function () { stopSeek(''); tune(f.hz); });
    ul.appendChild(li);
  });
}

// ── Listen: the receiver over WebRTC, receive only ───────────────────────
var pc = null, statsTimer = 0;
$('listen').addEventListener('click', function () {
  if (pc) { cmd('rtc.close', {}).catch(function () {}); stopListening(); return; }
  startListening().catch(function (e) { $('audio').textContent = 'listen: ' + (e && e.message ? e.message : e); stopListening(); });
});
function startListening() {
  $('listen').className = 'on'; $('listen').textContent = 'Stop';
  pc = new RTCPeerConnection();
  var mine = pc;
  pc.ontrack = function (ev) { $('rx').srcObject = ev.streams[0] || new MediaStream([ev.track]); $('rx').play().catch(function () {}); };
  pc.onconnectionstatechange = function () { if (pc === mine) $('audio').textContent = pc.connectionState; };
  pc.addTransceiver('audio', {direction: 'recvonly'});
  return pc.createOffer().then(function (o) { return mine.setLocalDescription(o); }).then(function () {
    if (mine.iceGatheringState === 'complete') return;
    return new Promise(function (ok) {
      mine.addEventListener('icegatheringstatechange', function () { if (mine.iceGatheringState === 'complete') ok(); });
    });
  }).then(function () {
    return cmd('rtc.offer', {sdp: mine.localDescription.sdp, rx: true});
  }).then(function (r) {
    return mine.setRemoteDescription({type: 'answer', sdp: r.sdp});
  }, function (e) { throw new Error(e && e.message ? e.message : 'rtc.offer failed'); });
}
function stopListening() {
  clearInterval(statsTimer);
  if (pc) pc.close();
  pc = null;
  $('rx').srcObject = null;
  $('listen').className = ''; $('listen').textContent = 'Listen';
  $('audio').textContent = '';
}

connect();
</script>
