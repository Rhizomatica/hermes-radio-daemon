; hermes-radio-daemon user / profile configuration
; Place this file at /etc/hermes/user.ini  (or pass -u <path>)
;
; A HERMES station has two profiles, as sbitx_controller had: profile0 for
; data (the modem) and profile1 for voice. The installer sets their
; frequencies and modes (DEFAULT_DATA_*, DEFAULT_VOICE_*) and digital voice
; (DIGITAL_VOICE). Up to nine profiles (profile0 to profile8) can be added
; for other modes: FM, AM, DRM, FT8, CW, RTTY. The shared-memory interface
; (radio_client -p) reaches profiles 0 to 3 only.

[main]
current_profile = 0
default_profile = 0
; Back to default_profile after this many seconds on another profile with
; no keying, tuning or volume change; -1 never (the default: the station
; stays on the profile its operator chose).
default_profile_fallback_timeout = -1
step_size = 100
tone_generation = 0

; ── profile0: data — the modem keys and feeds the radio ──────
; operating_mode 1: TX from the modem's audio, not the microphone.
[profile0]
freq = 7050000
mode = LSB
operating_mode = 1
power_level_percentage = 100
mic_level = 76
rx_level = 50
speaker_level = 10
tx_level = 96
bpf_low = 100
bpf_high = 3000
agc = OFF
compressor = OFF
tx_preemphasis = OFF
noise_reduction = OFF
digital_voice = 0
enable_knob_volume = 1
enable_knob_frequency = 0
enable_ptt = 0

; ── profile1: voice — full DSP chain ─────────────────────────
; operating_mode 0: TX from the microphone. digital_voice = 1 runs
; core.ini's digital_voice_codec (RADEV2 or DSTAR) on it.
[profile1]
freq = 7100000
mode = LSB
operating_mode = 0
power_level_percentage = 100
mic_level = 76
rx_level = 50
speaker_level = 10
tx_level = 96
bpf_low = 100
bpf_high = 3000
agc = SLOW
compressor = ON
tx_preemphasis = ON
noise_reduction = ON
digital_voice = 0
enable_knob_volume = 1
enable_knob_frequency = 1
enable_ptt = 1
