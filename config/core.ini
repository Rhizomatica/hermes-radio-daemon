; hermes-radio-daemon -- radio hardware configuration
; Installed at /etc/hermes/core.ini
;
; The daemon also looks for user/profiles at /etc/hermes/user.ini

[main]

; Logging: mercury's hermes_log, so radiod's, the Go API's and mercury's
; lines are one stream in one format:
;   2026-10-31 19:32:12.668 [+0.306s] [INF] [mercury-link] mercury starting (...)
; to stderr (journald under systemd) and, with log_file, to a file.
;   log_level             trace | debug | timing | info | warn | error (default info)
;   log_component_levels  per component, on stderr: "hamlib=debug, api.http=warn"
;   log_file              also write to this file ("" for none)
;   log_jsonl             1: the file in JSONL ({"t":...,"lv":"INF","c":...,"m":...})
;   log_utc               1: timestamps in UTC, with a Z (default: local time)
log_level = info
log_component_levels =
log_file =
log_jsonl = 0
log_utc = 0

; Radio backend selection.
;   hfsignals  embedded sBitx/zBitx DSP + ALSA path
;   hamlib     Hamlib CAT-controlled radios
radio_backend = hfsignals

; Hardware profile: sbitx | zbitx
; Selects GPIO pin layout, BFO frequency, and TX/RX switching
hw_profile = sbitx

; BFO frequency in Hz (override, default is per-profile)
bfo = 40035000

; Bridge compensation for SWR measurement (0-100)
bridge_compensation = 100

; Serial number (informational)
serial_number = 0

; SWR protection threshold: vswr * 10  (25 = SWR 2.5, 0 = disabled)
reflected_threshold = 25

; I2C device path for power/SWR ADC chip
i2c_dev = /dev/i2c-1

; GPS (station position), from gpsd's JSON socket or geoclue. The live fix is
; served by the API's GET /gps and the hermes.v1 gps topic; the settings are
; api-rest.yaml's GpsSettings (PATCH /gps/settings). Recorded position files
; are produced on demand, not continuously (see hermes-sensors).
;   gps_enable              1 to read the fix (default 0)
;   gps_source              gpsd (default), or geoclue: a Sailfish OS phone's
;                           own GPS, through geoclue's hybris provider on the
;                           user's session bus (Location must be on; needs a
;                           radio_daemon built with libdbus)
;   gps_host                gpsd host (default 127.0.0.1)
;   gps_port                gpsd port (default 2947)
;   gps_dbus_address        geoclue's session bus (default: the first user's
;                           under /run/user)
;   gps_logging             1 to record fixes to the GPS register (Phase 2)
;   gps_sample_interval_s   seconds between recorded fixes (>= 1, default 1)
;   gps_file_period_s       seconds per position file (>= 60, default 3600)
;   gps_email               report recipient, or empty for none
gps_enable = 0
gps_source = gpsd
gps_host = 127.0.0.1
gps_port = 2947
gps_dbus_address =
gps_logging = 0
gps_sample_interval_s = 1
gps_file_period_s = 3600
gps_email =

; Position beacons (docs/BEACON-FORMAT.md), over the broadcast plane below,
; which also receives them: with beacon_enable, one every beacon_interval_s;
; while an emergency code is set (beacon_emergency, set over the API), one
; every beacon_emergency_interval_s, enabled or not.  The position is the GPS
; fix, else the fixed station_latitude/station_longitude; with neither, no
; beacon goes out.  The API's GET/PATCH /gps/beacon has these settings.
;   beacon_enable                 1 to send this station's position (default 0)
;   beacon_interval_s             seconds between beacons (>= 60, default 900)
;   callsign                      the station's callsign, sent in each beacon
;   station_latitude/longitude    the fixed position, in degrees (empty: none)
;   beacon_emergency_interval_s   seconds between beacons in an emergency (>= 30, default 120)
beacon_enable = 0
beacon_interval_s = 900
callsign =
station_latitude =
station_longitude =
beacon_emergency_interval_s = 120

; PSKReporter (https://pskreporter.info): the FT8 stations this one decodes,
; reported as WSJT-X does: each callsign at most once an hour per band, in
; one UDP datagram every five minutes or so.  The receiver is the callsign
; above, at the GPS fix or else station_latitude/longitude (as a Maidenhead
; locator); without both nothing is sent.
;   pskreporter_enable    1 to report (default 0)
;   pskreporter_server    host[:port] (default report.pskreporter.info:4739);
;                         what it received shows at
;                         https://pskreporter.info/cgi-bin/psk-analysis.pl
;   pskreporter_antenna   the antenna, as the map shows it (empty: none)
pskreporter_enable = 0
pskreporter_server = report.pskreporter.info:4739
pskreporter_antenna =

; The broadcast plane: radiod is Mercury's broadcast client (the role of
; hermes-broadcast's broadcast_daemon), on Mercury's KISS port when Mercury
; runs as its own process, by direct calls with enable_mercury.  Files
; dropped in broadcast_tx_dir go out as a RaptorQ carousel ("-<N>_frames" in
; the name sends N frames, then the file is removed); files received appear
; in broadcast_rx_dir; beacons go both ways.
;   broadcast_enable    1 to run it (default 0)
;   broadcast_host      Mercury's host (default 127.0.0.1; KISS port only)
;   broadcast_port      Mercury's KISS broadcast port (default 8100; KISS port only)
;   broadcast_mode      Mercury's listen mode index, which must carry files
;                       (default 1, DATAC3; KISS port only: with
;                       enable_mercury the carousel is at Mercury's listen mode)
;   broadcast_tx_dir    default /var/spool/hermes-broadcast/tx
;   broadcast_rx_dir    default /var/spool/hermes-broadcast/rx
broadcast_enable = 0
broadcast_host = 127.0.0.1
broadcast_port = 8100
broadcast_mode = 1
broadcast_tx_dir = /var/spool/hermes-broadcast/tx
broadcast_rx_dir = /var/spool/hermes-broadcast/rx

; Store and forward (docs/api-design/store-and-forward.md): the API's queue,
; and what it sends to other stations, go over UUCP or NNCP, the one that
; reaches the station (/etc/uucp/sys, /etc/nncp/neigh).
;   transport_prefer      the one for a station both reach: nncp (default) or uucp
;   uucico_air_options    uucico's options on a call over the radio, e.g. -Y
;                         (the pre-agreed startup); empty for none
;   uucico_tcp_systems    UUCP systems reached over TCP, not the radio (a
;                         gateway's central server): no air options there
transport_prefer = nncp
uucico_air_options =
uucico_tcp_systems =

; Enable interfaces
enable_websocket = 0
enable_shm_control = 1

; WebSocket listener URL. Use ws://host:port for plaintext WebSocket, or
; wss://host:port to terminate TLS with CFG_SSL_CERT / CFG_SSL_KEY.
; Default is ws://0.0.0.0:8080.
websocket_url = ws://0.0.0.0:8080

; rigctld-compatible TCP server. Serves both backends: it presents the
; sBitx/zBitx as a hamlib rig, and on the hamlib backend it forwards to the
; real radio so several programs (WSJT-X, fldigi, a logger) can share one CAT
; port. Every control the rig exposes is reachable through it.
rig_server_enable = 1
rig_server_port = 4532

; Native-CAT gateway: a TCP port speaking the radio's OWN CAT dialect, for
; Windows software that can only open a COM port (N1MM+ among them). Pair it
; on Windows with com0com + hub4com (or VSPE) to get a virtual COM port.
; Programs that speak Hamlib (WSJT-X, fldigi, JTDX) should use the rigctld
; server above instead.
cat_server_enable = 0
cat_server_port = 4534

; Bind address. Empty = all interfaces. Set to 127.0.0.1 to keep the gateway
; local (e.g. when only a VPN or an SSH tunnel should reach it).
cat_server_bind =

; auto        passthrough when the backend has a real CAT rig, else emulate
; passthrough relay the client's bytes to the rig's own serial port
; emulate     answer a Kenwood TS-2000 dialect from the daemon's state, which
;             is how a radio without a CAT port (sBitx/zBitx on the hfsignals
;             backend) is reached from the same Windows software
cat_server_mode = auto

; Passthrough only: how long a transaction waits for the rig to start
; answering. A command that draws no reply costs exactly this much, so lower
; it (80-150) for a snappier logger, raise it for a slow-answering rig.
cat_reply_timeout_ms = 250

; Audio bridge for websocket RX/TX streaming (both backends). On the hamlib
; backend, set enable_audio_bridge = 1 to have the daemon open the rig's USB
; codec via ALSA and pump RX/TX audio to the browser. On hfsignals the
; embedded WM8731 path already feeds the rings; this flag still gates the
; flow into the websocket.
enable_audio_bridge = 0

; enable_loop_audio: the snd-aloop cables, for a modem or a digital-mode
; program that takes its audio from ALSA (hw:1,0 to it, hw:2,1 from it). Off
; by default: mercury in radiod (enable_mercury) or on RTP (enable_rtp_audio)
; takes its audio from radiod directly. On the sBitx this also runs its
; loopback threads; on the hamlib backend set loop_playback_device and
; loop_capture_device too.
enable_loop_audio = 0

; Noise reduction on the received audio, on every backend, for the voice
; profiles (operating_mode = 0) with noise_reduction = ON (user.ini), in USB,
; LSB, AM, FM and CW: what the browser, the websocket stream and a headset or
; the speaker play. The modem's profile is never denoised, and the digital
; modes' decoders get the audio as it is; on a Hamlib rig recordings and the
; spectrum do too (the sBitx denoises in its receive chain).
; rx_noise_reduction_db: how far the noise comes down, 0-40 dB.
; rx_noise_reduction_strength: how hard noise is told from signal, 0-1;
; higher removes more noise, and near 1 some of the signal with it.
; The defaults are what the sBitx's receiver was tuned to by ear.
rx_noise_reduction_db = 12
rx_noise_reduction_strength = 0.5

; capture_device / playback_device: ALSA device names. "default" works for
; rigs whose USB codec is the only sound card on the box; otherwise use
; "hw:CARD=Codec,DEV=0" etc.
; capture_device = default
; playback_device = default

; audio_sample_rate: rate the daemon audio rings carry — this is what the
; browser receives and what recording/spectrum use. 48000 is a reasonable
; default for both hamlib rig USB codecs and the hfsignals path.
audio_sample_rate = 48000

; rig_audio_rate: native rate of the rig-facing ALSA device. Leave at 0 to
; mean "same as audio_sample_rate". When set (e.g. 48000), the audio bridge
; resamples between the rig native rate and the ring rate — useful when the
; daemon DSP runs at a different rate than the rig USB codec exposes.
rig_audio_rate = 0

; ALSA period size (frames). 480 = 10 ms at 48 kHz, large enough for the
; 256-tap spectrum FFT. Smaller values reduce latency at higher CPU cost.
audio_period_size = 480

; Optional operator-side headset. When both _capture_device and
; _playback_device are set, the daemon opens a second pair of ALSA devices
; and mirrors RX/TX audio onto a hardware headset wired into the daemon box.
; Leave empty (default) to use only the browser as the operator endpoint.
; headset_capture_device = hw:Headset,0
; headset_playback_device = hw:Headset,0
; headset_sample_rate = 48000

; Dream (DRM, MODE_DRM), receiver and transmitter: the channel is centred
; on the dial (the profile's bpf_high is its half width, 5200 for 10 kHz).
; Dream runs in recording_dir/drm-rx and drm-tx, with the Dream.ini radiod
; writes there. The transmission's parameters:
;   drm_robustness: A to D (B for skywave)
;   drm_spectrum: occupancy 0 to 5 (0: 4.5 kHz, 1: 5, 2: 9, 3: 10, 4: 18,
;     5: 20); in B, 3 gives 14 kbit/s with 16-QAM, 20 with 64; 1 gives 6.9
;     (xHE-AAC from about 6 kbit/s, HE-AAC), 0 gives 4.8-6 (HE-AAC only).
;     At 0 and 1 the SDC is 16-QAM, with room for the label and xHE-AAC.
;   drm_msc_qam: 16 or 64; 64-QAM needs some 6 dB more SNR (on air, about
;     10 dB decoded at 16 and not at 64); drm_protection: 0 to 3 (1: 0.6)
;   drm_codec: xHE-AAC, HE-AAC (AAC with SBR, 12 kHz core) or AAC
;   drm_label: 1 to 16 of A-Z a-z 0-9 space . _ - /
;   (these six can also be set at run time: digi_config, the web page)
;   drm_tx_gain: the I/Q's level into the transmitter
dream_path = /usr/bin/dream
drm_robustness = B
drm_spectrum = 3
drm_msc_qam = 16
drm_protection = 1
drm_codec = xHE-AAC
drm_label = HERMES
drm_tx_gain = 0.5

; FT8/CW/RTTY message spool directory
digi_spool_dir = /var/spool/hermes-digi

; Digital-mode TX drive (CW/FT8/RTTY/RADAE). 1.0 = encoder native level.
; Raise to push more audio into the rig USB codec if the rig isn't getting
; enough drive; clipped at full scale. Try 1.5–3.0 if levels are low.
digi_tx_gain = 1.0

; CW keyer settings
cw_wpm = 20
cw_pitch = 700

; RTTY settings
rtty_baud = 45
rtty_mark = 1585
rtty_shift = 170

; digital_voice_codec: what a profile's digital voice runs, RADEV2 (default)
; or DSTAR. With DSTAR, digital voice on puts the profile in DSTAR mode and
; off puts it back in the mode it had. DSTAR needs the sbitx backend. It
; never turns dstar_encrypt on: leave that 0 on the air.
digital_voice_codec = RADEV2

; D-STAR settings
; D-STAR DV settings.
;
; IMPORTANT: these keys must stay inside [main]. The daemon reads them as
; main:dstar_*, and an installed core.ini has the [tx_band0..7] power
; calibration sections after [main] — a dstar_ key appended at the end of
; such a file belongs to the last section, is never found, and every value
; silently falls back to its default (polarity +1, verbose 0), which decodes
; nothing and logs nothing. The daemon prints the values in force at D-STAR
; init; check that line if RX does not work.
;
; dstar_polarity: -1 when the FM discriminator is inverted (which it is on
; the sbitx hfsignals path). Wrong polarity = no sync at all.
dstar_deviation = 1200
dstar_mycall = N0CALL
dstar_urcall = CQCQCQ
dstar_verbose = 0
dstar_denoise = 1
dstar_polarity = 1

; dstar_clock_ppm: sample-clock correction for the D-STAR RX chain.
;
; The rig's 4800 baud clock and the sbitx codec's sampling clock are
; independent crystals. An uncorrected offset walks the symbol sampling point
; through the eye (a symbol is only 5 samples at 24 kHz), which holds sync and
; decodes the header but turns the AMBE voice into garble. Measured on
; one sBitx: its codec runs ~+300 ppm fast, so dstar_clock_ppm = 301 took the
; FEC error rate from 2.68 to 0.47 per frame and lost syncs from 4 to 0.
;
; radiod measures it itself (dstar_clock_auto, below) from the overs it
; decodes and saves it here. To measure by hand: dump the 24 kHz modem input
; (touch /tmp/dstar_rx24_dump), find the baud line in it — it should sit at
; exactly 4800 Hz — and set this to the negated offset in ppm.
dstar_clock_ppm = 0
; dstar_clock_auto: 1 (the default) calibrates dstar_clock_ppm between overs,
; from the baud line of the overs heard (needs 6 readings of 2 s that agree;
; moves by 10 ppm or more); 0 keeps the value above.
dstar_clock_auto = 1

; dstar_af_gain: listening level for the DECODED voice (speaker + websocket).
; Separate from dstar_rx_gain, which scales the discriminator signal into the
; modem — that one is a demodulator input level, not a volume control. Raise
; this if D-STAR sounds quieter than SSB at the same speaker_level.
dstar_af_gain = 1.0

; Opt-in D-STAR voice encryption (HERMES extension; stock D-STAR radios hear
; an encrypted over as silence/garble, but still see the callsigns, which
; stay in the clear). The AMBE voice bits are XORed with ChaCha20 keystream;
; see dsp/dstar_voice.h. Encryption is not permitted on amateur bands.
; voice_key_file: 32 raw bytes or 64 hex digits, chmod 600. Every station
;   on the net needs the same key. Receiving decrypts whenever a key is
;   loaded, and mutes encrypted overs it cannot decrypt.
; dstar_encrypt: 1 encrypts every over this station sends. With no key
;   loaded, overs go out as silence -- never in the clear.
;voice_key_file = /etc/hermes/voice.key
dstar_encrypt = 0
; rade_encrypt: the same for RADE V2 (HERMES extension; dsp/rade_voice.h).
;   The modem's latent is mixed with a keyed transform and two extra
;   carriers, either side of RADE's 14, carry the over's nonce and frame
;   counter, so a receiver locks within about 1 s (2-3 s near the lowest
;   SNR), joining at any point. Stock RADE V2 receivers hear an encrypted
;   over as noise; a receiver with a voice key mutes overs it cannot
;   decrypt. Same voice_key_file, same rules.
rade_encrypt = 0


; --- per-band TX power calibration ---
; Each band has f_start (Hz), f_stop (Hz), and scale (multiplier). The
; daemon has no built-in scales: with no section covering the active
; frequency the multiplier is 0, radiod logs "Error finding band gain!" and
; nothing is transmitted (forward power stays 0). Keep these sections, and
; adjust the scales per your radio. They must come after [main].
; Defaults are the sBitx's calibration.
[tx_band0]
f_start = 1000000
f_stop = 2000000
scale = 4.0

[tx_band1]
f_start = 2000000
f_stop = 3000000
scale = 2.5

[tx_band2]
f_start = 3000000
f_stop = 4000000
scale = 2.0

[tx_band3]
f_start = 4000000
f_stop = 5700000
scale = 1.8

[tx_band4]
f_start = 5700000
f_stop = 6800000
scale = 1.5

[tx_band5]
f_start = 6800000
f_stop = 7500000
scale = 1.5

[tx_band6]
f_start = 7500000
f_stop = 12500000
scale = 2.0

[tx_band7]
f_start = 12500000
f_stop = 30000000
scale = 2.5
