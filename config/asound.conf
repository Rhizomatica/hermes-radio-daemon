# Shared RX capture for the HERMES daemon + mercury on one radio sound card.
# dsnoop shares the ADC between readers (ipc_perm 0666 = cross-user). dmix is
# NOT used: this C-Media USB codec cannot init a dmix sum buffer, and HF is
# half-duplex so only one app ever TXs -> playback is a plain (exclusive) plug.

pcm.cmedia_cap {
    type dsnoop
    ipc_key 7770
    ipc_perm 0666
    slave { pcm "hw:0,0"; channels 1; format S16_LE; rate 48000; period_size 480; buffer_size 3840 }
}
pcm.radioin  { type plug; slave.pcm "cmedia_cap" }
pcm.radioout { type plug; slave.pcm "hw:0,0" }
pcm.radio    { type asym; playback.pcm "radioout"; capture.pcm "radioin" }
pcm.!default { type asym; playback.pcm "radioout"; capture.pcm "radioin" }
ctl.!default { type hw; card 0 }
