# /etc/asound.conf — shared access to a single radio sound card so the HERMES
# radio daemon AND another modem (e.g. mercury) can use it at the same time.
#
# Without this, the first process opens hw:0,0 exclusively and the second gets
# "Device or resource busy" (-16). dsnoop shares one capture stream between
# readers; dmix shares one playback stream between writers. ipc_perm 0666 lets
# processes running as different users (root daemon + non-root modem) attach to
# the same IPC. plug wraps each so callers can request any rate/format/channels.
#
# Point BOTH apps at "radioin" (capture) / "radioout" (playback) — or just use
# "default"/"radio" for full duplex. Adjust the slave "hw:0,0" card index and
# the slave channels/rate to your codec (here: C-Media USB, mono in / stereo
# out, 48 kHz, S16_LE).

pcm.cmedia_cap {
    type dsnoop
    ipc_key 7770
    ipc_perm 0666
    slave { pcm "hw:0,0"; channels 1; format S16_LE; rate 48000; period_size 1024; buffer_size 8192 }
}
pcm.cmedia_play {
    type dmix
    ipc_key 7771
    ipc_perm 0666
    slave { pcm "hw:0,0"; channels 2; format S16_LE; rate 48000; period_size 1024; buffer_size 8192 }
}
pcm.radioin  { type plug; slave.pcm "cmedia_cap" }
pcm.radioout { type plug; slave.pcm "cmedia_play" }
pcm.radio    { type asym; playback.pcm "radioout"; capture.pcm "radioin" }
pcm.!default { type asym; playback.pcm "radioout"; capture.pcm "radioin" }
ctl.!default { type hw; card 0 }
