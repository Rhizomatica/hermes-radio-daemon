<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HERMES Radio Control</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: monospace; background: #111; color: #0f0; max-width: 900px; margin: 0 auto; padding: 10px; }
h1, h2 { color: #0f0; margin: 10px 0; }
.panel { border: 1px solid #333; padding: 10px; margin: 8px 0; border-radius: 4px; }
input, select, button { padding: 5px 8px; margin: 2px; border: 1px solid #333; background: #222; color: #0f0; font-family: monospace; }
button { cursor: pointer; background: #1a3a1a; }
button:hover { background: #2a5a2a; }
label { color: #080; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#messages { height: 300px; overflow-y: auto; font-size: 12px; white-space: pre; background: #000; border: 1px solid #333; padding: 5px; }
#messages div { padding: 1px 0; }
#messages .rx { color: #0f0; }
#messages .tx { color: #0af; }
#status { color: #888; font-size: 11px; }
#connect { background: #3a1a1a; }
#connect:hover { background: #5a2a2a; }
.connected { color: #0f0; }
.disconnected { color: #f00; }
#audio-status { font-size: 11px; }
#spec-scope { width: 100%; height: 90px; background: #001016; display: block; border: 1px solid #333; border-bottom: none; image-rendering: pixelated; }
    #spec-wf { width: 100%; height: 170px; background: #000; display: block; border: 1px solid #333; image-rendering: pixelated; }
    #freq-axis { display: flex; justify-content: space-between; font: 11px monospace; color: #8cf; padding: 3px 2px 0; }
.tab { display: inline-block; padding: 4px 12px; cursor: pointer; border: 1px solid #333; border-bottom: none; background: #1a1a1a; }
.tab.active { background: #222; color: #0f0; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<h1>HERMES Radio Control</h1>

<div class="panel row">
  <label>WS:</label>
  <input type="text" id="ws-url" size="32">
  <button id="connect" onclick="ws_connect()">Connect</button>
  <span id="status" class="disconnected">disconnected</span>
</div>
<script>
  // Default the WS URL to the host this page was served from, picking
  // ws:// or wss:// to match the page protocol so a https:// page doesn't
  // try to open a mixed-content ws://.
  (function() {
    var isTLS = window.location.protocol === 'https:';
    var host  = window.location.hostname || 'localhost';
    var port  = window.location.port || (isTLS ? '8080' : '8080');
    document.getElementById('ws-url').value =
      (isTLS ? 'wss://' : 'ws://') + host + ':' + port;
  })();
</script>

<!-- Tabs -->
<div style="margin-top: 10px;">
  <span class="tab active" onclick="show_tab('ctrl')">Control</span>
  <span class="tab" onclick="show_tab('digi')">Digital Modes</span>
  <span class="tab" onclick="show_tab('spectrum-tab')">Spectrum</span>
</div>

<!-- Control tab -->
<div id="tab-ctrl" class="tab-content active">
  <div class="panel">
    <h2>Radio State</h2>
    <div class="row">
      <label>Freq (Hz):</label>
      <input type="text" id="freq" size="10" value="14200000">
      <button onclick="send_cmd('set_frequency', 'value', document.getElementById('freq').value)">Set</button>
      <label style="margin-left:12px">Profile:</label>
      <select id="profile" onchange="send_cmd('set_profile', 'value', this.value)">
        <option value="0">0: Data</option>
        <option value="1">1: SSB</option>
        <option value="2">2: FM</option>
        <option value="3">3: AM</option>
        <option value="4">4: DRM</option>
        <option value="5">5: DV</option>
        <option value="6">6: FT8</option>
        <option value="7">7: CW</option>
        <option value="8">8: RTTY</option>
      </select>
    </div>
    <div class="row" style="margin-top:6px">
      <label>Mode:</label>
      <select id="mode" onchange="send_cmd('set_mode', 'value', this.value)">
        <option value="USB">USB</option><option value="LSB">LSB</option>
        <option value="FM">FM</option><option value="AM">AM</option>
        <option value="DRM">DRM</option>
        <option value="FT8">FT8</option>
        <option value="CW">CW</option><option value="RTTY">RTTY</option>
      </select>
      <button id="ptt-btn" onclick="ptt_toggle()">PTT ON</button>
      <button onclick="send_cmd('get_state')">Refresh</button>
    </div>
    <div id="state" style="margin-top:6px; font-size:12px; color:#888;"></div>
  </div>
</div>

<!-- Digital modes tab -->
<div id="tab-digi" class="tab-content">
  <div class="panel">
    <h2>Digital Mode Messages</h2>
    <div class="row">
      <input type="text" id="digi-text" size="40" placeholder="CQ CQ DE CALLSIGN GRID" onkeydown="if(event.key==='Enter')send_digi()">
      <button onclick="send_digi()">Send TX</button>
      <button onclick="send_cmd('digi_messages', 'count', '20')">Refresh</button>
    </div>
    <div id="messages"></div>
  </div>
  <div class="panel">
    <h2>Digital Mode Config</h2>
    <div class="row">
      <label>CW WPM:</label>
      <input type="number" id="cw_wpm" value="20" size="4" min="5" max="60">
      <button onclick="set_digi_config('cw_wpm')">Set</button>
      <label style="margin-left:10px">CW Pitch:</label>
      <input type="number" id="cw_pitch" value="700" size="4" min="300" max="1000">
      <button onclick="set_digi_config('cw_pitch')">Set</button>
    </div>
    <div class="row" style="margin-top:4px">
      <label>RTTY Baud:</label>
      <input type="number" id="rtty_baud" value="45" size="4">
      <button onclick="set_digi_config('rtty_baud')">Set</button>
      <label style="margin-left:10px">RTTY Mark:</label>
      <input type="number" id="rtty_mark" value="1585" size="5">
      <button onclick="set_digi_config('rtty_mark')">Set</button>
      <label style="margin-left:10px">RTTY Shift:</label>
      <input type="number" id="rtty_shift" value="170" size="4">
      <button onclick="set_digi_config('rtty_shift')">Set</button>
    </div>
    <div id="digi-config-status" style="margin-top:4px; font-size:11px; color:#888;"></div>
  </div>
</div>

<!-- Spectrum tab -->
<div id="tab-spectrum-tab" class="tab-content">
  <div class="panel">
    <h2>RX Spectrum &amp; Waterfall</h2>
    <div class="row" style="margin-bottom:6px; font-size:12px">
      <label>Floor: <span id="wf-min-v">-90</span> dB</label>
      <input type="range" id="wf-min" min="-130" max="0" value="-90" oninput="wf_cal()">
      <label>Ceiling: <span id="wf-max-v">-20</span> dB</label>
      <input type="range" id="wf-max" min="-130" max="0" value="-20" oninput="wf_cal()">
      <label>Palette:</label>
      <select id="wf-palette" onchange="wf_cal()">
        <option value="turbo">Turbo</option>
        <option value="grey">Grey</option>
        <option value="green">Green</option>
      </select>
      <label>Speed:</label>
      <select id="wf-speed" onchange="wf_cal()">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
    <div id="spectrum">
      <canvas id="spec-scope"></canvas>
      <canvas id="spec-wf"></canvas>
    </div>
    <div id="freq-axis"><span id="axis-l">—</span><span id="axis-c">—</span><span id="axis-r">—</span></div>
    <div id="audio-status">No audio data yet</div>
  </div>
</div>

<script>
var ws = null;
var audio_ctx = null;
var spec_canvas = null;
var spec_ctx = null;
var ptt_on = false;
var ws_url = '';
var g_freq = 0;       // last known dial frequency (Hz), for the spectrum axis
var g_mode = '';      // last known mode string ("LSB"/"USB"/...), for sideband

function $(id) { return document.getElementById(id); }

function log(msg, cls) {
  var m = $('messages');
  var d = document.createElement('div');
  d.className = cls || '';
  d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  m.prepend(d);
}

function show_tab(name) {
  document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  $('tab-' + name).classList.add('active');
  if (name === 'spectrum-tab') start_spectrum();
}

function ws_connect() {
  ws_url = $('ws-url').value;
  if (ws) { ws.close(); ws = null; }

  ws = new WebSocket(ws_url);
  ws.binaryType = 'arraybuffer';

  ws.onopen = function() {
    $('status').textContent = 'connected';
    $('status').className = 'connected';
    $('connect').textContent = 'Disconnect';
    send_cmd('get_state');
    send_cmd('digi_get_config');
  };

  ws.onclose = function() {
    $('status').textContent = 'disconnected';
    $('status').className = 'disconnected';
    $('connect').textContent = 'Connect';
    ws = null;
  };

  ws.onmessage = function(ev) {
    if (typeof ev.data === 'string') {
      handle_text(ev.data);
    } else {
      handle_binary(new Uint8Array(ev.data));
    }
  };
}

function handle_text(data) {
  try {
    var j = JSON.parse(data);
    // State frames are emitted both as a reply to {cmd:"get_state"} and
    // as periodic broadcasts; both are tagged "type":"state". The
    // server doesn't echo a "cmd" field on those, so key on type.
    if (j.type === 'state') {
      if (j.frequency !== undefined || j.freq !== undefined) {
        g_freq = j.frequency !== undefined ? j.frequency : j.freq;
        $('freq').value = g_freq;
      }
      if (j.profile !== undefined) $('profile').value = j.profile;
      if (j.mode) { g_mode = j.mode; $('mode').value = j.mode; }
      if (j.txrx_state !== undefined) {
        ptt_on = (j.txrx_state === 1);
        $('ptt-btn').textContent = ptt_on ? 'PTT OFF' : 'PTT ON';
      }
      $('state').textContent = JSON.stringify(j, null, 1);
    }
    if (j.cmd === 'digi_messages') {
      $('messages').innerHTML = '';
      var msgs = j.messages || [];
      for (var i = msgs.length - 1; i >= 0; i--) {
        var cls = (msgs[i].indexOf('tx ') >= 0) ? 'tx' : 'rx';
        log(msgs[i], cls);
      }
    }
    if (j.cmd === 'digi_get_config') {
      if (j.cw_wpm) $('cw_wpm').value = j.cw_wpm;
      if (j.cw_pitch) $('cw_pitch').value = j.cw_pitch;
      if (j.rtty_baud) $('rtty_baud').value = j.rtty_baud;
      if (j.rtty_mark) $('rtty_mark').value = j.rtty_mark;
      if (j.rtty_shift) $('rtty_shift').value = j.rtty_shift;
    }
    if (j.cmd === 'digi_config' || j.cmd === 'digi_send') {
      var msg = j.ok ? (j.status || 'OK') : ('Failed: ' + (j.error || ''));
      $('digi-config-status').textContent = j.cmd + ': ' + msg;
    }
  } catch(e) {}
}

function handle_binary(data) {
  if (data.length < 2) return;
  if (data[0] === 0x01) {
    play_audio(data.subarray(1));
  }
  if (data[0] === 0x02) {
    draw_spectrum(data.subarray(1));
  }
}

function send_cmd(cmd, key, val) {
  if (!ws) return;
  var obj = { cmd: cmd };
  var profile = parseInt($('profile').value);
  if (['get_frequency','set_frequency','get_mode','set_mode','get_power','set_power','get_volume','set_volume'].indexOf(cmd) >= 0)
    obj.profile = profile;
  if (key && val) obj[key] = val;
  ws.send(JSON.stringify(obj));
}

function send_digi() {
  send_cmd('digi_send', 'text', $('digi-text').value);
  log('tx ' + $('digi-text').value, 'tx');
  $('digi-text').value = '';
}

function set_digi_config(key) {
  // The handler wants {cmd:"digi_config", key, value} in a single
  // message; send_cmd takes one key/val pair so build the JSON inline.
  if (!ws) return;
  var v = parseInt($(key).value);
  if (isNaN(v)) return;
  ws.send(JSON.stringify({ cmd: 'digi_config', key: key, value: v }));
}

function ptt_toggle() {
  send_cmd(ptt_on ? 'ptt_off' : 'ptt_on');
}

function play_audio(samples16) {
  if (!audio_ctx) audio_ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 8000});
  var buf = audio_ctx.createBuffer(1, samples16.length / 2, 8000);
  var ch = buf.getChannelData(0);
  var view = new DataView(samples16.buffer, samples16.byteOffset, samples16.byteLength);
  for (var i = 0; i < ch.length; i++)
    ch[i] = view.getInt16(i * 2, true) / 32768.0;
  var src = audio_ctx.createBufferSource();
  src.buffer = buf;
  src.connect(audio_ctx.destination);
  src.start();
}

function start_spectrum() {
  if (!audio_ctx) audio_ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 8000});
}

// Waterfall calibration (live-tunable from the UI).
var wf_min = -90, wf_max = -20, wf_palette = 'turbo', wf_speed = 1;
function wf_cal() {
  wf_min = parseInt($('wf-min').value);
  wf_max = parseInt($('wf-max').value);
  if (wf_max <= wf_min) wf_max = wf_min + 1;
  wf_palette = $('wf-palette').value;
  wf_speed = parseInt($('wf-speed').value);
  $('wf-min-v').textContent = wf_min;
  $('wf-max-v').textContent = wf_max;
}

// Map a normalised level t (0..1) to a colour for the chosen palette.
function wf_color(t) {
  if (t < 0) t = 0; if (t > 1) t = 1;
  if (wf_palette === 'grey') { var v = Math.round(t * 255); return 'rgb(' + v + ',' + v + ',' + v + ')'; }
  if (wf_palette === 'green') return 'hsl(120,100%,' + Math.round(t * 60) + '%)';
  // turbo-ish: blue -> cyan -> green -> yellow -> red
  return 'hsl(' + Math.round((1 - t) * 240) + ',100%,' + Math.round(8 + t * 47) + '%)';
}

// Radio-style panadapter: a spectrum scope (instantaneous amplitude vs
// frequency) above a scrolling waterfall, plotted over a real RF axis — like
// an FT-710 / IC-7300 screen. The daemon ships bins in RF-ascending order (it
// flips LSB internally), plus Hz-per-bin in the frame and the dial freq/mode
// in the state, so the X axis reads true frequency, not raw audio.
// Frame after the 0x02 opcode: [sample_rate u32][nbins u16][bin_hz f32][bins f32...].
function draw_spectrum(data) {
  var dv = new DataView(data.buffer, data.byteOffset, data.byteLength);
  if (dv.byteLength < 10) return;
  var bins = dv.getUint16(4, true);
  var bin_hz = dv.getFloat32(6, true);
  var n = (dv.byteLength - 10) / 4;
  if (n !== bins || n < 1) return;

  var db = new Float32Array(n);
  for (var i = 0; i < n; i++) db[i] = dv.getFloat32(10 + i * 4, true);

  var span = wf_max - wf_min; if (span < 1) span = 1;

  // ---- spectrum scope (top): filled amplitude-vs-frequency trace ----
  var sc = $('spec-scope');
  if (sc) {
    if (sc.width !== bins) { sc.width = bins; sc.height = 90; }
    var s = sc.getContext('2d');
    s.clearRect(0, 0, sc.width, sc.height);
    s.strokeStyle = 'rgba(90,90,90,0.5)'; s.lineWidth = 1;          // freq grid (1/4 marks)
    for (var g = 1; g < 4; g++) { var gx = (bins * g / 4) | 0; s.beginPath(); s.moveTo(gx, 0); s.lineTo(gx, sc.height); s.stroke(); }
    s.beginPath(); s.moveTo(0, sc.height);
    for (var i = 0; i < n; i++) {
      var t = (db[i] - wf_min) / span; if (t < 0) t = 0; if (t > 1) t = 1;
      s.lineTo(i, sc.height - t * sc.height);
    }
    s.lineTo(bins - 1, sc.height); s.closePath();
    s.fillStyle = 'rgba(0,210,130,0.30)'; s.fill();
    s.strokeStyle = '#2fe88a'; s.lineWidth = 1; s.stroke();
  }

  // ---- waterfall (bottom): scroll down, paint the new frame as the top row ----
  var wf = $('spec-wf');
  if (wf) {
    if (wf.width !== bins) { wf.width = bins; wf.height = 170; var ic = wf.getContext('2d'); ic.fillStyle = '#000'; ic.fillRect(0, 0, wf.width, wf.height); }
    var w = wf.getContext('2d');
    var rows = wf_speed;
    w.drawImage(wf, 0, rows);
    for (var i = 0; i < n; i++) {
      w.fillStyle = wf_color((db[i] - wf_min) / span);
      w.fillRect(i, 0, 1, rows);
    }
  }

  // ---- RF frequency axis (sideband-aware) ----
  // Bins are RF-ascending. USB: the dial (suppressed carrier) sits at the
  // low-freq (left) edge; LSB: the daemon flipped the bins so the dial is at
  // the high-freq (right) edge. Label left / centre / right in MHz.
  var total = n * bin_hz;
  var lsb = (g_mode === 'LSB');
  var lo = lsb ? (g_freq - total) : g_freq;
  var hi = lsb ? g_freq : (g_freq + total);
  var mhz = function (f) { return (f / 1e6).toFixed(4); };
  if (g_freq > 0) {
    $('axis-l').textContent = mhz(lo);
    $('axis-c').textContent = mhz((lo + hi) / 2);
    $('axis-r').textContent = mhz(hi);
  }
  $('audio-status').textContent = 'dial ' + (g_freq / 1e6).toFixed(4) + ' MHz ' + (g_mode || '?') +
    ' | span ' + Math.round(total) + ' Hz | ' + bins + ' bins @ ' + bin_hz.toFixed(1) + ' Hz/bin' +
    ' | floor ' + wf_min + ' / ceil ' + wf_max + ' dB';
}
</script>
</body>
</html>
